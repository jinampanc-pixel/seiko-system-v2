version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      framework-stack:
        patterns:
          - "vinext"
          - "vite"
          - "@vitejs/plugin-*"
          - "@cloudflare/vite-plugin"
          - "wrangler"
          - "react"
          - "react-dom"
          - "react-server-dom-webpack"
        update-types:
          - minor
          - patch
      lint-stack:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "@next/eslint-plugin-next"
          - "eslint-plugin-*"
          - "typescript-eslint"
          - "globals"
        update-types:
          - minor
          - patch
      styling-stack:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/postcss"
        update-types:
          - minor
          - patch
      type-definitions:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      database-tooling:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
