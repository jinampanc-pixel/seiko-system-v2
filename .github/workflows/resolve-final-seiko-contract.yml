name: Resolve final stale SEIKO contract

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/resolve-final-seiko-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Align final contract and clean diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/seiko-stage2-audit-contract.test.mjs')
          text = p.read_text()
          old = '''test("editing an existing order returns to and updates its workspace", () => {\n  assert.match(orders, /setView\\(current\\.revisions\\.length \\? "workspace" : "center"\\)/);\n  assert.match(orders, /order\\.revisions\\.length \\? "Update workspace" : "Create workspace"/);\n});'''
          new = '''test("editing an existing order returns to its actual setup origin", () => {\n  assert.match(orders, /setView\\(existingOrder \\? setupReturnView : "workspace"\\)/);\n  assert.match(orders, /returnView === "workspace" \\? "Update workspace" : "Save changes"/);\n  assert.match(orders, /onCancel=\\{\\(\\) => setView\\(current\\.revisions\\.length \\? setupReturnView : "center"\\)\\}/);\n});'''
          if text.count(old) != 1:
              raise SystemExit('final stale Order Setup contract marker not found exactly once')
          p.write_text(text.replace(old, new, 1))
          diag = Path('ci-test-build-diagnostic.txt')
          if diag.exists(): diag.unlink()
          PY
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm -f .github/workflows/resolve-final-seiko-contract.yml
          git add tests/seiko-stage2-audit-contract.test.mjs
          git add -u ci-test-build-diagnostic.txt || true
          git commit -m "Align final SEIKO return-path contract"
          git push origin HEAD:fix/veyn-milestone-one
