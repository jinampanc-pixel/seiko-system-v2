name: Inspect SEIKO app worker

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/inspect-seiko-app-worker.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Inspect base app worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: seiko-system-v2-app
        run: |
          set -euo pipefail
          echo "WORKER=$WORKER_NAME"
          echo "--- deployments ---"
          npx wrangler deployments list --name "$WORKER_NAME" || true
          echo "--- settings ---"
          RESPONSE="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")"
          RESPONSE="$RESPONSE" node -e 'const p=JSON.parse(process.env.RESPONSE||"{}"); console.log(JSON.stringify({success:p.success,bindings:(p.result?.bindings||[]).map(b=>({name:b.name,type:b.type,database_id:b.id||b.database_id})),compatibility_date:p.result?.compatibility_date||null},null,2));'
          echo "--- version upload help ---"
          npx wrangler versions upload --help | grep -E "preview|alias|name" || true
