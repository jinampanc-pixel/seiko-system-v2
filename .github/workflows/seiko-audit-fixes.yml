name: Apply SEIKO audit fixes

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/seiko-audit-fixes.yml
      - .github/scripts/apply-seiko-audit-fixes.cjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0

      - name: Apply targeted source fixes
        run: node .github/scripts/apply-seiko-audit-fixes.cjs

      - name: Commit fixes
        run: |
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app/orders.tsx app/order-setup-polish.tsx app/label-designer-polish.tsx app/label-designer.tsx app/label-finalization.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Complete audited SEIKO Stage 2 operational fixes"
          git push origin HEAD:fix/veyn-milestone-one
