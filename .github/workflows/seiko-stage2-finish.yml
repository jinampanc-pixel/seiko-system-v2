name: Apply SEIKO Stage 2 finish

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/seiko-stage2-finish.yml
      - .github/scripts/apply-seiko-stage2-finish.cjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - run: node .github/scripts/apply-seiko-stage2-finish.cjs
      - run: |
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app/orders.tsx tests/foundation-contract.test.mjs tests/seiko-stage2-audit-contract.test.mjs package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish audited SEIKO Stage 2 order workflow"
          git push origin HEAD:fix/veyn-milestone-one
