name: Fix preview validation ordering

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/fix-preview-validation-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Move clean validation before preview mutation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-shopify-preview.yml')
          text = p.read_text()
          block = '      - name: Test and build\n        run: npm test\n\n'
          if text.count(block) != 1:
              raise SystemExit(f'expected exactly one Test and build block, found {text.count(block)}')
          text = text.replace(block, '', 1)
          marker = '      - name: Resolve isolated preview D1 database\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one D1 marker, found {text.count(marker)}')
          text = text.replace(marker, block + marker, 1)
          p.write_text(text)
          PY
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm -f .github/workflows/diagnose-seiko-validation.yml .github/workflows/fix-preview-validation-order.yml
          git add .github/workflows/deploy-shopify-preview.yml
          git commit -m "Validate clean source before preview config mutation"
          git push origin HEAD:fix/veyn-milestone-one
