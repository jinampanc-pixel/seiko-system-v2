name: Fix SEIKO label category regex

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/fix-seiko-label-category-regex.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Escape literal slashes and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/label-production-ready.tsx')
          text = path.read_text()
          old = 'if (/^(Person / workpiece|Group / label type)$/i.test(text)'
          new = 'if (/^(Person \\/ workpiece|Group \\/ label type)$/i.test(text)'
          if old not in text:
              raise SystemExit('category matcher target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-seiko-label-category-regex.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app .github
          git commit -m "Fix SEIKO label category matcher"
          git push origin HEAD:fix/veyn-milestone-one
