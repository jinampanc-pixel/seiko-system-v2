name: Diagnose SEIKO test build

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/diagnose-seiko-test-build.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture contracts and build separately
        shell: bash
        run: |
          npm ci >/tmp/install.log 2>&1
          set +e
          npm run test:contracts >/tmp/contracts.log 2>&1
          contracts=$?
          npm run build >/tmp/build.log 2>&1
          build=$?
          set -e
          export CONTRACTS_EXIT="$contracts" BUILD_EXIT="$build"
          python3 - <<'PY'
          from pathlib import Path
          import os
          def summarize(path):
              text = Path(path).read_text(errors='replace')
              lines = text.splitlines()
              hits = [i for i,l in enumerate(lines) if any(k in l for k in ('not ok','AssertionError','ERR_ASSERTION','error TS','Type error','Build failed','ERROR','Error:'))]
              out=[]
              for i in hits:
                  out.extend(lines[max(0,i-5):min(len(lines),i+35)])
                  out.append('---')
              if not out:
                  out=lines[-160:]
              return '\n'.join(out)[-20000:]
          Path('ci-test-build-diagnostic.txt').write_text(
              f"CONTRACTS_EXIT={os.environ.get('CONTRACTS_EXIT')}\nBUILD_EXIT={os.environ.get('BUILD_EXIT')}\n\n=== CONTRACTS ===\n"+summarize('/tmp/contracts.log')+"\n\n=== BUILD ===\n"+summarize('/tmp/build.log'))
          PY
      - name: Commit diagnostic and self-clean
        run: |
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm .github/workflows/diagnose-seiko-test-build.yml
          git add ci-test-build-diagnostic.txt
          git commit -m "Capture remaining SEIKO test build diagnostic"
          git push origin HEAD:fix/veyn-milestone-one
