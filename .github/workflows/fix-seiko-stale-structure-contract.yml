name: Fix stale workspace structure contract

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/fix-seiko-stale-structure-contract.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Align contract with lint-clean explicit control flow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/seiko-stage2-audit-contract.test.mjs')
          text = path.read_text()
          old = 'assert.match(structure, /event\\.ctrlKey \\|\\| event\\.metaKey/);'
          new = 'assert.match(structure, /event\\.ctrlKey\\s*\\|\\|\\s*event\\.metaKey/);'
          if old not in text:
              raise SystemExit('stale Ctrl/Cmd structure assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-seiko-stale-structure-contract.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add tests .github
          git commit -m "Align workspace structure acceptance contract"
          git push origin HEAD:fix/veyn-milestone-one
