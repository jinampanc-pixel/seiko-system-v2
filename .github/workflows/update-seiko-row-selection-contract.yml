name: Update SEIKO spreadsheet selection contract

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/update-seiko-row-selection-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Replace superseded checkbox assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/seiko-stage2-audit-contract.test.mjs')
          text = path.read_text()
          text = text.replace('assert.match(rowActions, /Shift-click selects a range/);', 'assert.match(rowActions, /Shift-click a range/);')
          text = text.replace('assert.match(rowActions, /workspaceSelectHead/);\n  assert.match(rowActions, /workspaceSelectCell/);', 'assert.match(rowActions, /workspaceRowHeaderHead/);\n  assert.match(rowActions, /workspaceRowHeaderCell/);\n  assert.doesNotMatch(rowActions, /recordSelectToggle/);')
          path.write_text(text)
          PY
          git rm .github/workflows/update-seiko-row-selection-contract.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add tests .github
          git commit -m "Update SEIKO spreadsheet row selection contract"
          git push origin HEAD:fix/veyn-milestone-one
