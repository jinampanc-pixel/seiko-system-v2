name: Deploy Shopify Preview

on:
  push:
    branches:
      - fix/veyn-milestone-one
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seiko-shopify-preview-deploy
  cancel-in-progress: true

env:
  PREVIEW_WORKER_NAME: seiko-system-v2-shopify-test
  PREVIEW_DB_NAME: seiko-system-v2-shopify-test-db
  PRODUCTION_DB_NAME: seiko-system-v2-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contract tests
        run: npm run test:contracts

      - name: Production build
        run: npm run build

      - name: Render checks
        run: npm run test:render

      - name: Verify preview credentials exist
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          JINAM_PREVIEW_ADMIN_PASSWORD: ${{ secrets.JINAM_PREVIEW_ADMIN_PASSWORD }}
        run: |
          test -n "$SHOPIFY_CLIENT_ID" || (echo "SHOPIFY_CLIENT_ID is missing" && exit 1)
          test -n "$SHOPIFY_CLIENT_SECRET" || (echo "SHOPIFY_CLIENT_SECRET is missing" && exit 1)
          test -n "$JINAM_PREVIEW_ADMIN_PASSWORD" || (echo "JINAM_PREVIEW_ADMIN_PASSWORD is missing" && exit 1)
          test "${#JINAM_PREVIEW_ADMIN_PASSWORD}" -ge 12 || (echo "JINAM_PREVIEW_ADMIN_PASSWORD must be at least 12 characters" && exit 1)

      - name: Resolve isolated preview D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIST_JSON="$(npx wrangler d1 list --json)"
          DB_ID="$(D1_LIST="$LIST_JSON" DB_NAME="$PREVIEW_DB_NAME" node -e 'const rows=JSON.parse(process.env.D1_LIST||"[]"); const row=rows.find(x=>x.name===process.env.DB_NAME); process.stdout.write(row?.uuid||row?.id||"")')"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$PREVIEW_DB_NAME" --location apac
            LIST_JSON="$(npx wrangler d1 list --json)"
            DB_ID="$(D1_LIST="$LIST_JSON" DB_NAME="$PREVIEW_DB_NAME" node -e 'const rows=JSON.parse(process.env.D1_LIST||"[]"); const row=rows.find(x=>x.name===process.env.DB_NAME); process.stdout.write(row?.uuid||row?.id||"")')"
          fi
          test -n "$DB_ID" || (echo "Could not resolve isolated preview D1 database ID" && exit 1)
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Point build at isolated preview resources
        env:
          PREVIEW_DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.name = process.env.PREVIEW_WORKER_NAME;
          if (!Array.isArray(config.d1_databases) || !config.d1_databases[0]) throw new Error('D1 binding missing');
          config.d1_databases[0].database_name = process.env.PREVIEW_DB_NAME;
          config.d1_databases[0].database_id = process.env.PREVIEW_DB_ID;
          config.vars = {
            ...(config.vars || {}),
            SHOPIFY_SCOPES: 'read_orders',
            JINAM_ENVIRONMENT: 'shopify-test',
          };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Seed preview owner with test-only password
        id: preview_owner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_DB_ID: ${{ steps.d1.outputs.database_id }}
          JINAM_PREVIEW_ADMIN_PASSWORD: ${{ secrets.JINAM_PREVIEW_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          LIST_JSON="$(npx wrangler d1 list --json)"
          PROD_DB_ID="$(D1_LIST="$LIST_JSON" DB_NAME="$PRODUCTION_DB_NAME" node -e 'const rows=JSON.parse(process.env.D1_LIST||"[]"); const row=rows.find(x=>x.name===process.env.DB_NAME); process.stdout.write(row?.uuid||row?.id||"")')"
          test -n "$PROD_DB_ID" || (echo "Could not resolve production D1 database for owner-only auth bootstrap" && exit 1)

          cat > /tmp/preview-auth-schema.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS erp_users (
            id TEXT PRIMARY KEY NOT NULL,
            email TEXT NOT NULL,
            phone_e164 TEXT,
            display_name TEXT,
            password_hash TEXT,
            must_change_password INTEGER DEFAULT 1 NOT NULL,
            active INTEGER DEFAULT 1 NOT NULL,
            password_updated_at TEXT,
            last_login_at TEXT,
            created_at TEXT NOT NULL,
            created_by_email TEXT NOT NULL,
            updated_at TEXT NOT NULL,
            updated_by_email TEXT NOT NULL
          );
          CREATE UNIQUE INDEX IF NOT EXISTS erp_users_email_uq ON erp_users(email);
          CREATE UNIQUE INDEX IF NOT EXISTS erp_users_phone_uq ON erp_users(phone_e164);
          CREATE TABLE IF NOT EXISTS erp_memberships (
            id TEXT PRIMARY KEY NOT NULL,
            user_id TEXT NOT NULL,
            business_id TEXT NOT NULL,
            role TEXT NOT NULL,
            active INTEGER DEFAULT 1 NOT NULL,
            created_at TEXT NOT NULL,
            created_by_email TEXT NOT NULL,
            updated_at TEXT NOT NULL,
            updated_by_email TEXT NOT NULL
          );
          CREATE UNIQUE INDEX IF NOT EXISTS erp_memberships_user_business_uq ON erp_memberships(user_id, business_id);
          SQL
          npx wrangler d1 execute "$PREVIEW_DB_NAME" --remote --file=/tmp/preview-auth-schema.sql

          OWNER_JSON="$(npx wrangler d1 execute "$PRODUCTION_DB_NAME" --remote --json --command="SELECT u.email, u.display_name, m.business_id, m.role FROM erp_users u JOIN erp_memberships m ON m.user_id = u.id WHERE lower(m.role) = 'owner' AND u.active = 1 AND m.active = 1 ORDER BY u.created_at ASC LIMIT 1;")"
          OWNER_EMAIL="$(OWNER_JSON="$OWNER_JSON" node -e 'const raw=JSON.parse(process.env.OWNER_JSON||"[]"); const rows=Array.isArray(raw)?(raw[0]?.results||raw[0]?.result||[]):[]; process.stdout.write(rows[0]?.email||"")')"
          OWNER_NAME="$(OWNER_JSON="$OWNER_JSON" node -e 'const raw=JSON.parse(process.env.OWNER_JSON||"[]"); const rows=Array.isArray(raw)?(raw[0]?.results||raw[0]?.result||[]):[]; process.stdout.write(rows[0]?.display_name||"Owner")')"
          OWNER_BUSINESS="$(OWNER_JSON="$OWNER_JSON" node -e 'const raw=JSON.parse(process.env.OWNER_JSON||"[]"); const rows=Array.isArray(raw)?(raw[0]?.results||raw[0]?.result||[]):[]; process.stdout.write(rows[0]?.business_id||"")')"
          OWNER_ROLE="$(OWNER_JSON="$OWNER_JSON" node -e 'const raw=JSON.parse(process.env.OWNER_JSON||"[]"); const rows=Array.isArray(raw)?(raw[0]?.results||raw[0]?.result||[]):[]; process.stdout.write(rows[0]?.role||"owner")')"
          test -n "$OWNER_EMAIL" || (echo "No active production owner available for preview bootstrap" && exit 1)
          test -n "$OWNER_BUSINESS" || (echo "No active owner business available for preview bootstrap" && exit 1)

          PASSWORD_HASH="$(PASSWORD="$JINAM_PREVIEW_ADMIN_PASSWORD" node - <<'NODE'
          const crypto = require('node:crypto');
          const password = process.env.PASSWORD;
          const iterations = 310000;
          const digest = 'sha256';
          const salt = crypto.randomBytes(16).toString('base64url');
          const hash = crypto.pbkdf2Sync(password, salt, iterations, 32, digest).toString('base64url');
          process.stdout.write(`pbkdf2$${digest}$${iterations}$${salt}$${hash}`);
          NODE
          )"
          PREVIEW_USER_ID="preview-owner"
          PREVIEW_MEMBERSHIP_ID="preview-owner-membership"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          esc() { printf "%s" "$1" | sed "s/'/''/g"; }
          SQL="INSERT OR REPLACE INTO erp_users (id,email,display_name,password_hash,must_change_password,active,password_updated_at,created_at,created_by_email,updated_at,updated_by_email) VALUES ('$(esc "$PREVIEW_USER_ID")','$(esc "$OWNER_EMAIL")','$(esc "$OWNER_NAME")','$(esc "$PASSWORD_HASH")',0,1,'$(esc "$NOW")','$(esc "$NOW")','preview','$(esc "$NOW")','preview'); INSERT OR REPLACE INTO erp_memberships (id,user_id,business_id,role,active,created_at,created_by_email,updated_at,updated_by_email) VALUES ('$(esc "$PREVIEW_MEMBERSHIP_ID")','$(esc "$PREVIEW_USER_ID")','$(esc "$OWNER_BUSINESS")','$(esc "$OWNER_ROLE")',1,'$(esc "$NOW")','preview','$(esc "$NOW")','preview');"
          npx wrangler d1 execute "$PREVIEW_DB_NAME" --remote --command="$SQL"
          echo "owner_email=$OWNER_EMAIL" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          JINAM_PREVIEW_ADMIN_PASSWORD: ${{ secrets.JINAM_PREVIEW_ADMIN_PASSWORD }}
        run: |
          printf '%s' "$SHOPIFY_CLIENT_ID" | npx wrangler secret put SHOPIFY_CLIENT_ID --name "$PREVIEW_WORKER_NAME"
          printf '%s' "$SHOPIFY_CLIENT_SECRET" | npx wrangler secret put SHOPIFY_CLIENT_SECRET --name "$PREVIEW_WORKER_NAME"
          printf '%s' "$JINAM_PREVIEW_ADMIN_PASSWORD" | npx wrangler secret put JINAM_PREVIEW_ADMIN_PASSWORD --name "$PREVIEW_WORKER_NAME"

      - name: Verify preview owner login
        env:
          PREVIEW_OWNER_EMAIL: ${{ steps.preview_owner.outputs.owner_email }}
          JINAM_PREVIEW_ADMIN_PASSWORD: ${{ secrets.JINAM_PREVIEW_ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const { setTimeout: sleep } = require('node:timers/promises');
          const base = 'https://seiko-system-v2-shopify-test.jinampanc.workers.dev';
          let last = '';
          for (let i = 0; i < 12; i++) {
            try {
              const response = await fetch(`${base}/api/auth/login`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ email: process.env.PREVIEW_OWNER_EMAIL, password: process.env.JINAM_PREVIEW_ADMIN_PASSWORD }),
              });
              last = `${response.status} ${await response.text()}`;
              if (response.ok) process.exit(0);
            } catch (error) {
              last = String(error);
            }
            await sleep(5000);
          }
          console.error(`Preview owner login failed: ${last}`);
          process.exit(1);
          NODE

      - name: Smoke test isolated preview
        run: |
          node <<'NODE'
          const { setTimeout: sleep } = require('node:timers/promises');
          const base = 'https://seiko-system-v2-shopify-test.jinampanc.workers.dev';
          let last = '';
          for (let i = 0; i < 12; i++) {
            try {
              const response = await fetch(base, { redirect: 'manual' });
              last = `${response.status} ${response.headers.get('location') || ''}`;
              if (response.status >= 200 && response.status < 500) process.exit(0);
            } catch (error) {
              last = String(error);
            }
            await sleep(5000);
          }
          console.error(`Preview smoke test failed: ${last}`);
          process.exit(1);
          NODE
