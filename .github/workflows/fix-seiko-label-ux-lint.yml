name: Fix SEIKO label UX lint blockers

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/fix-seiko-label-ux-lint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Fix lint blockers and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path

          polish = Path('app/label-designer-polish.tsx')
          text = polish.read_text()
          old = "meaning.innerHTML = '<b>Layout</b> saves the reusable physical design, size, components and placement. <b>Label set</b> saves this order's selected records for repeat printing.';"
          new = 'meaning.innerHTML = "<b>Layout</b> saves the reusable physical design, size, components and placement. <b>Label set</b> saves this order\'s selected records for repeat printing.";'
          if old not in text:
              raise SystemExit('layout meaning lint target not found')
          polish.write_text(text.replace(old, new, 1))

          interactions = Path('app/label-designer-interactions.tsx')
          text = interactions.read_text()
          old = 'const [labelW, _labelH, rollW, columns, outer, gapX] = numeric.map(input => Number(input.value));'
          new = 'const [labelW, , rollW, columns, outer, gapX] = numeric.map(input => Number(input.value));'
          if old not in text:
              raise SystemExit('size validation lint target not found')
          interactions.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-seiko-label-ux-lint.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app .github
          git commit -m "Fix SEIKO label UX lint blockers"
          git push origin HEAD:fix/veyn-milestone-one
