name: Diagnose SEIKO contract orchestration

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/diagnose-contract-concurrency.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Combined contracts default concurrency
        continue-on-error: true
        run: npm run test:contracts
      - name: Combined contracts single concurrency
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/foundation-contract.test.mjs tests/navigation-contract.test.mjs tests/architecture-contract.test.mjs tests/ui-consistency-contract.test.mjs tests/auth-contract.test.mjs tests/modern-auth-contract.test.mjs tests/veyn-milestone-contract.test.mjs tests/jinam-product-architecture.test.mjs tests/meth-seiko-commerce-contract.test.mjs tests/meth-commerce-settings-contract.test.mjs tests/seiko-meth-handoff-controls-contract.test.mjs tests/channel-connectors-contract.test.mjs tests/seiko-stage2-audit-contract.test.mjs tests/seiko-list-centers-contract.test.mjs tests/seiko-shared-label-structure-contract.test.mjs tests/seiko-operational-ux-contract.test.mjs tests/seiko-workspace-label-accuracy-contract.test.mjs tests/seiko-runtime-preview-contract.test.mjs tests/seiko-last-mile-contract.test.mjs
      - name: Production build
        continue-on-error: true
        run: npm run build
      - name: Render checks
        continue-on-error: true
        run: npm run test:render
