name: Remove superseded SEIKO refinement updater

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/apply-seiko-refinement.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Remove superseded Packing-only updater
        run: |
          git rm -f scripts/apply-seiko-refinement.py .github/workflows/apply-seiko-refinement.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git commit -m "Remove superseded Packing-only SEIKO updater"
          git push origin HEAD:fix/veyn-milestone-one
