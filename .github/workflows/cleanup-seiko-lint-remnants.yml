name: Clean SEIKO lint remnants

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/cleanup-seiko-lint-remnants.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Remove obsolete remnants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Removed source-field custom combobox is no longer part of accepted setup UX.
          path = Path('app/order-setup-polish.tsx')
          text = path.read_text()
          text, count = re.subn(r'\nfunction manageSourcePicker\(picker: HTMLElement\) \{.*?\n\}\n\nfunction lockIrrelevantDefaults', '\nfunction lockIrrelevantDefaults', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('manageSourcePicker cleanup target not found')
          path.write_text(text)

          # Removed split-label dropdown left these props/state behind.
          path = Path('app/orders.tsx')
          text = path.read_text()
          text = text.replace(', onCreateLabel }: { businessId: string; canManageSuggestions?: boolean; initialOrder?: SeikoOrder|null; onOpenLabelBatches?: (order: SeikoOrder) => void; onCreateLabel?: (order: SeikoOrder, purpose: "production"|"packing"|"inventory") => void })', ' }: { businessId: string; canManageSuggestions?: boolean; initialOrder?: SeikoOrder|null; onOpenLabelBatches?: (order: SeikoOrder) => void })', 1)
          text = text.replace(' onOpenLabelBatches={()=>onOpenLabelBatches?.(current)} onCreateLabel={purpose=>onCreateLabel?.(current,purpose)} onChange={setCurrent}', ' onOpenLabelBatches={()=>onOpenLabelBatches?.(current)} onChange={setCurrent}', 1)
          text = text.replace('function OrderWorkspace({ businessId, canManageSuggestions, order, onChange, onEditSetup, onOpenLabelBatches, onCreateLabel, onSave, onClose }: { businessId: string; canManageSuggestions: boolean; order: SeikoOrder; onChange: (order: SeikoOrder) => void; onEditSetup: () => void; onOpenLabelBatches: () => void; onCreateLabel: (purpose:"production"|"packing"|"inventory")=>void; onSave: (close: boolean) => void; onClose: () => void })', 'function OrderWorkspace({ businessId, canManageSuggestions, order, onChange, onEditSetup, onOpenLabelBatches, onSave, onClose }: { businessId: string; canManageSuggestions: boolean; order: SeikoOrder; onChange: (order: SeikoOrder) => void; onEditSetup: () => void; onOpenLabelBatches: () => void; onSave: (close: boolean) => void; onClose: () => void })', 1)
          text = text.replace('  const [labelMenuOpen,setLabelMenuOpen]=useState(false);\n  const labelMenuRef=useRef<HTMLDivElement>(null);\n', '', 1)
          text = text.replace('  useEffect(()=>{const close=(event:globalThis.MouseEvent)=>{if(labelMenuRef.current&&!labelMenuRef.current.contains(event.target as Node))setLabelMenuOpen(false)};document.addEventListener("mousedown",close);return()=>document.removeEventListener("mousedown",close)},[]);\n', '', 1)
          if 'onCreateLabel' in text or 'labelMenuOpen' in text or 'labelMenuRef' in text:
              raise SystemExit('obsolete label-menu remnants still present')
          path.write_text(text)
          PY
      - name: Commit source cleanup and remove this workflow
        run: |
          git rm .github/workflows/cleanup-seiko-lint-remnants.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app .github
          git commit -m "Remove obsolete SEIKO UI remnants"
          git push origin HEAD:fix/veyn-milestone-one
