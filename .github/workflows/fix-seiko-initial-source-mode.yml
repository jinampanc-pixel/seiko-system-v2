name: Fix SEIKO initial source mode

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/fix-seiko-initial-source-mode.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Fix designer signature and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/label-designer.tsx')
          text = path.read_text()
          old = 'export function LabelDesigner({ businessId, canManageSizes, order, onBack, initialPurpose = null }: {'
          new = 'export function LabelDesigner({ businessId, canManageSizes, order, onBack, initialPurpose = null, initialSourceMode }: {'
          if old not in text:
              raise SystemExit('LabelDesigner signature target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-seiko-initial-source-mode.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app .github
          git commit -m "Fix SEIKO label initial representation wiring"
          git push origin HEAD:fix/veyn-milestone-one
