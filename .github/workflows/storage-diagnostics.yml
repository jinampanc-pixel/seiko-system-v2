name: SEIKO storage diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Check export, file storage and independent backup configuration
        run: node scripts/storage-diagnostics.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEIKO_BACKUP_RECOVERY_KEY: ${{ secrets.SEIKO_BACKUP_RECOVERY_KEY }}
          SEIKO_DRIVE_CLIENT_ID: ${{ secrets.SEIKO_DRIVE_CLIENT_ID }}
          SEIKO_DRIVE_CLIENT_SECRET: ${{ secrets.SEIKO_DRIVE_CLIENT_SECRET }}
          SEIKO_DRIVE_REFRESH_TOKEN: ${{ secrets.SEIKO_DRIVE_REFRESH_TOKEN }}
          SEIKO_DRIVE_FOLDER_ID: ${{ vars.SEIKO_DRIVE_FOLDER_ID }}
          SEIKO_CLOUD_BACKUP_ENABLED: ${{ vars.SEIKO_CLOUD_BACKUP_ENABLED }}
