name: Apply SEIKO precision pass

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/apply-seiko-precision-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Apply guarded precision fixes
        run: python3 scripts/apply_seiko_precision_pass.py
      - name: Commit cleaned source
        shell: bash
        run: |
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm -f .github/workflows/apply-seiko-precision-pass.yml scripts/apply_seiko_precision_pass.py
          git add app tests
          git commit -m "Fix SEIKO workspace labels navigation and settings precision"
          git push origin HEAD:fix/veyn-milestone-one
