name: Retry guarded SEIKO UX finalizer

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/run-fix-seiko-ux-20260901-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Correct duplicate-guard expectations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/fix-seiko-ux-20260901.py')
          text = p.read_text()
          old_back = '''replace_once(
              'app/orders.tsx',
              '{order.revisions.length ? "← Back to Workspace" : "← Back to Orders"}',
              '{order.revisions.length && returnView === "workspace" ? "← Back to Workspace" : "← Back to Orders"}',
          )'''
          new_back = '''orders_text = read('app/orders.tsx')
          old_back = '{order.revisions.length ? "← Back to Workspace" : "← Back to Orders"}'
          new_back = '{order.revisions.length && returnView === "workspace" ? "← Back to Workspace" : "← Back to Orders"}'
          if orders_text.count(old_back) != 2:
              raise SystemExit(f'app/orders.tsx: expected 2 Setup Back labels, found {orders_text.count(old_back)}')
          write('app/orders.tsx', orders_text.replace(old_back, new_back))'''
          old_primary = '''replace_once(
              'app/orders.tsx',
              '{order.revisions.length ? "Update workspace" : "Create workspace"}',
              '{order.revisions.length ? (returnView === "workspace" ? "Update workspace" : "Save changes") : "Create workspace"}',
          )'''
          new_primary = '''orders_text = read('app/orders.tsx')
          old_primary = '{order.revisions.length ? "Update workspace" : "Create workspace"}'
          new_primary = '{order.revisions.length ? (returnView === "workspace" ? "Update workspace" : "Save changes") : "Create workspace"}'
          if orders_text.count(old_primary) != 2:
              raise SystemExit(f'app/orders.tsx: expected 2 Setup primary actions, found {orders_text.count(old_primary)}')
          write('app/orders.tsx', orders_text.replace(old_primary, new_primary))'''
          if old_back not in text or old_primary not in text:
              raise SystemExit('temporary patch script no longer has expected duplicate-guard blocks')
          p.write_text(text.replace(old_back, new_back, 1).replace(old_primary, new_primary, 1))
          PY
      - name: Apply guarded source changes
        run: python3 .github/scripts/fix-seiko-ux-20260901.py
      - name: Commit source and remove temporary patch machinery
        shell: bash
        run: |
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm -f .github/scripts/fix-seiko-ux-20260901.py .github/workflows/run-fix-seiko-ux-20260901.yml .github/workflows/run-fix-seiko-ux-20260901-v2.yml
          git add app tests
          git commit -m "Refine SEIKO workspace setup and label UX"
          git push origin HEAD:fix/veyn-milestone-one
