name: Apply SEIKO runtime regression fixes

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/fix-seiko-runtime-regressions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Patch source-owned runtime behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Order Workspace: real back control + repair broken three-dot click handler.
          replace_once(
              "app/orders.tsx",
              'onOpenLabelBatches={()=>onOpenLabelBatches?.(current)} onChange={setCurrent}',
              'onOpenLabelBatches={()=>onOpenLabelBatches?.(current)} onBack={() => save(current, "Order saved", true)} onChange={setCurrent}',
          )
          replace_once(
              "app/orders.tsx",
              'function OrderWorkspace({ businessId, canManageSuggestions, order, onChange, onEditSetup, onOpenLabelBatches, onSave, onArchive, onDelete, onClose }:',
              'function OrderWorkspace({ businessId, canManageSuggestions, order, onChange, onEditSetup, onOpenLabelBatches, onBack, onSave, onArchive, onDelete, onClose }:',
          )
          replace_once(
              "app/orders.tsx",
              'onOpenLabelBatches: () => void; onSave: (close: boolean) => void;',
              'onOpenLabelBatches: () => void; onBack: () => void; onSave: (close: boolean) => void;',
          )
          replace_once(
              "app/orders.tsx",
              'onClick={()=>{setLabelMenuOpen(false);setOrderMenuOpen(value=>!value)}}',
              'onClick={()=>setOrderMenuOpen(value=>!value)}',
          )
          replace_once(
              "app/orders.tsx",
              'return <div className="page workspacePage">\n    <div className="orderPageHead workspaceHead"><div><p className="eyebrow">',
              'return <div className="page workspacePage">\n    <div className="orderPageHead workspaceHead"><div><button type="button" className="textButton workspaceBackButton" onClick={onBack}>← Back to Orders</button><p className="eyebrow">',
          )

          # Root navigation: do not asynchronously reset a requested nested module back to Home.
          replace_once(
              "app/page.tsx",
              '      setBusinesses(next);\n      setBusinessId(next.some(item => item.businessId === saved) ? saved! : next[0].businessId);\n      setModule("home");',
              '      setBusinesses(next);\n      setBusinessId(next.some(item => item.businessId === saved) ? saved! : next[0].businessId);',
          )

          # Order Center: keep the actual React-owned status select visible and interactive.
          replace_once(
              "app/seiko-operational-ux.tsx",
              '    statusWrap?.setAttribute("hidden", "");',
              '    statusWrap?.removeAttribute("hidden");\n    statusWrap?.classList.add("orderCenterInlineStatus");',
          )
          p = Path("app/seiko-operational-ux.tsx")
          text = p.read_text()
          text, n = re.subn(
              r'\n    let badge = detail\?\.querySelector<HTMLElement>\("\.orderCenterStatusBadge"\);.*?\n    if \(badge\) badge\.textContent = order\.status;\n',
              '\n    detail?.querySelector<HTMLElement>(".orderCenterStatusBadge")?.remove();\n',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f"app/seiko-operational-ux.tsx: status badge block replacement count {n}")
          old = '      appendMetaItem(meta, "Status", order.status);\n'
          if text.count(old) != 1:
              raise SystemExit("app/seiko-operational-ux.tsx: expected one static status meta item")
          text = text.replace(old, '', 1)
          p.write_text(text)

          # Order Center + Workspace presentation for the repaired native controls.
          replace_once(
              "app/seiko-operational-ux.css",
              'grid-template-columns:minmax(260px,1.05fr) minmax(500px,1.35fr) 38px!important;',
              'grid-template-columns:minmax(250px,1.05fr) 142px minmax(470px,1.35fr) 38px!important;',
          )
          p = Path("app/seiko-operational-ux.css")
          text = p.read_text()
          marker = '.ordersPage .orderRowClickable>div:first-child>small[hidden]{display:none!important}\n'
          addition = marker + '.ordersPage .orderCenterInlineStatus{display:grid!important;align-self:center!important;min-width:0!important}\n.ordersPage .orderCenterInlineStatus select{box-sizing:border-box!important;width:100%!important;height:36px!important;border:1px solid var(--line)!important;border-radius:8px!important;padding:0 26px 0 9px!important;color:var(--ink)!important;font-size:10px!important;font-weight:800!important;cursor:pointer!important}\n'
          if text.count(marker) != 1:
              raise SystemExit("app/seiko-operational-ux.css: inline status insertion marker missing")
          p.write_text(text.replace(marker, addition, 1))

          p = Path("app/order-enhancements.css")
          text = p.read_text()
          marker = '.workspaceHead{position:relative;align-items:flex-start}\n'
          addition = marker + '.workspaceBackButton{display:inline-flex!important;align-items:center!important;min-height:30px!important;margin:0 0 5px!important;padding:4px 0!important;color:var(--navy)!important;font-size:10px!important;font-weight:800!important;text-decoration:none!important}\n.workspaceBackButton:hover{text-decoration:underline!important}\n'
          if text.count(marker) != 1:
              raise SystemExit("app/order-enhancements.css: workspace back insertion marker missing")
          p.write_text(text.replace(marker, addition, 1))

          # Label Workspace: default packing labels from the real order fields, not generic hidden fields.
          p = Path("app/label-designer.tsx")
          text = p.read_text()
          marker = 'const initial: Item[] = [{ id: "name", kind: "field", field: "name", value: "Name", x: 3, y: 3, w: 27, h: 5, font: 10, bold: true }, { id: "product", kind: "field", field: "product", value: "Product", x: 3, y: 9, w: 27, h: 4, font: 7 }, { id: "qr", kind: "qr", value: "token", x: 36, y: 3, w: 11, h: 11, font: 7 }];\n'
          helper = marker + '''function defaultLabelItems(order: SeikoOrder | null | undefined, purpose: LabelPurpose | null, source: SourceMode): Item[] {\n    const copyInitial = () => initial.map(item => ({ ...item }));\n    if (!order) return copyInitial();\n    if (purpose === "packing" && source === "person") {\n        const personFields = order.fields.filter(field => field.name.trim()).slice(0, 3);\n        const fields: Item[] = [\n            { id: crypto.randomUUID(), kind: "field", field: "client", value: "Client name", fieldLabel: "Client name", x: 2, y: 2, w: 32, h: 3.5, font: 5.5, bold: true },\n            ...personFields.map((field, index) => ({ id: crypto.randomUUID(), kind: "field" as const, field: `field:${field.id}`, value: field.name, fieldLabel: field.name, x: 2, y: 6 + index * 4, w: 32, h: 3.5, font: index === 0 ? 7 : 5.5, bold: index === 0 })),\n            { id: crypto.randomUUID(), kind: "field", field: "product_summary", value: "Package contents", fieldLabel: "Package contents", x: 2, y: 18, w: 32, h: 4, font: 5.25 },\n        ];\n        return [...fields, { id: "qr", kind: "qr", value: "token", x: 37, y: 3, w: 10, h: 10, font: 7 }];\n    }\n    return copyInitial();\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit("app/label-designer.tsx: initial marker missing")
          text = text.replace(marker, helper, 1)
          old = '    const [purpose, setPurpose] = useState<LabelPurpose | null>(order ? initialPurpose : "production");\n    const [sourceMode, setSourceModeState] = useState<SourceMode>(initialSourceMode || (initialPurpose === "packing" ? "person" : initialPurpose === "inventory" ? "product" : "person_product"));'
          new = '    const [purpose, setPurpose] = useState<LabelPurpose | null>(order ? initialPurpose : "production");\n    const defaultSourceMode: SourceMode = initialSourceMode || (initialPurpose === "packing" ? "person" : initialPurpose === "inventory" ? "product" : "person_product");\n    const [sourceMode, setSourceModeState] = useState<SourceMode>(defaultSourceMode);'
          if text.count(old) != 1:
              raise SystemExit("app/label-designer.tsx: source-mode state marker missing")
          text = text.replace(old, new, 1)
          old = '    const [selectedRows, setSelectedRows] = useState(() => records[0] ? [records[0].id] : []), [items, setItems] = useState<Item[]>(initial), [selectedId, setSelectedId] = useState("name"), [snap, setSnap] = useState(true), [guides, setGuides] = useState(true);'
          new = '    const [selectedRows, setSelectedRows] = useState(() => records[0] ? [records[0].id] : []), [items, setItems] = useState<Item[]>(() => defaultLabelItems(order, initialPurpose, defaultSourceMode)), [selectedId, setSelectedId] = useState(""), [snap, setSnap] = useState(true), [guides, setGuides] = useState(true);'
          if text.count(old) != 1:
              raise SystemExit("app/label-designer.tsx: item state marker missing")
          text = text.replace(old, new, 1)
          old = '    const setSourceMode = (next: SourceMode) => { setSourceModeState(next); const nextRecords = order ? resolveLabelRows(order, next, packageGroupBy, packageCounts, personPackagePlan, includedProducts) : []; setSelectedRows(nextRecords[0] ? [nextRecords[0].id] : []); setRecordFilterField(""); setRecordFilterValue(""); };\n    const choosePurpose = (next: LabelPurpose) => { setPurpose(next); setSourceMode(next === "production" ? "person_product" : next === "inventory" ? "product" : "person"); };'
          new = '''    const setSourceMode = (next: SourceMode) => { setSourceModeState(next); const nextRecords = order ? resolveLabelRows(order, next, packageGroupBy, packageCounts, personPackagePlan, includedProducts) : []; setSelectedRows(nextRecords[0] ? [nextRecords[0].id] : []); setRecordFilterField(""); setRecordFilterValue(""); setItems(all => { const relevant = all.filter(item => item.kind !== "field" || fieldRelevantForPurpose(item.field || "", purpose, next)); return relevant.some(item => item.kind === "field") ? relevant : defaultLabelItems(order, purpose, next); }); };\n    const choosePurpose = (next: LabelPurpose) => { const nextSource: SourceMode = next === "production" ? "person_product" : next === "inventory" ? "product" : "person"; setPurpose(next); setSourceModeState(nextSource); const nextRecords = order ? resolveLabelRows(order, nextSource, packageGroupBy, packageCounts, personPackagePlan, includedProducts) : []; setSelectedRows(nextRecords[0] ? [nextRecords[0].id] : []); setRecordFilterField(""); setRecordFilterValue(""); setItems(all => { const relevant = all.filter(item => item.kind !== "field" || fieldRelevantForPurpose(item.field || "", next, nextSource)); return relevant.some(item => item.kind === "field") ? relevant : defaultLabelItems(order, next, nextSource); }); };'''
          if text.count(old) != 1:
              raise SystemExit("app/label-designer.tsx: source/purpose setters marker missing")
          text = text.replace(old, new, 1)
          old = '    if (purpose === "packing") return !genericWorkpiece && !productionOnly && key !== "variation_count";'
          new = '    if (purpose === "packing") return !genericWorkpiece && !productionOnly && key !== "variation_count" && !(source === "person" && key === "product");'
          if text.count(old) != 1:
              raise SystemExit("app/label-designer.tsx: packing relevance marker missing")
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Information chooser count must reflect the actual React-selected chips; trace fields get their own group.
          p = Path("app/label-designer-polish.tsx")
          text = p.read_text()
          old = 'function groupForLabel(label: string) {\n  if (label.startsWith("Person detail ·")) return "Person details";\n  if (label.includes(" · ")) return `Product details · ${label.split(" · ")[0]}`;\n  return "Core information";\n}'
          new = 'function groupForLabel(label: string) {\n  if (label.startsWith("Person detail ·")) return "Person details";\n  if (/^(Trace code|Label number|Person number|Product number|Number within|Piece \\/ pair|Package \\/ set)/i.test(label)) return "Trace & codes";\n  if (label.includes(" · ")) return `Product details · ${label.split(" · ")[0]}`;\n  return "Core information";\n}'
          if text.count(old) != 1:
              raise SystemExit("app/label-designer-polish.tsx: group function marker missing")
          text = text.replace(old, new, 1)
          old = '    const chosenCount = () => checklist.querySelectorAll<HTMLInputElement>(\':scope > .fieldChoice input[type="checkbox"]:checked\').length;'
          new = '    const chosenCount = () => section.querySelectorAll(".labelInfoSelectedStripReact .labelInfoChip").length || checklist.querySelectorAll<HTMLInputElement>(\':scope > .fieldChoice input[type="checkbox"]:checked\').length;'
          if text.count(old) != 1:
              raise SystemExit("app/label-designer-polish.tsx: chosen count marker missing")
          text = text.replace(old, new, 1)
          old = '    const count = checklist.querySelectorAll<HTMLInputElement>(\':scope > .fieldChoice input[type="checkbox"]:checked\').length;\n    toggle.textContent = `Choose information · ${count} selected`;'
          new = '    const count = section.querySelectorAll(".labelInfoSelectedStripReact .labelInfoChip").length || checklist.querySelectorAll<HTMLInputElement>(\':scope > .fieldChoice input[type="checkbox"]:checked\').length;\n    toggle.textContent = `Choose information · ${count} selected`;'
          if text.count(old) != 1:
              raise SystemExit("app/label-designer-polish.tsx: collapsed count marker missing")
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Remove the DOM-position override; source-owned millimetre arrangement is now authoritative.
          p = Path("app/label-workspace-refinement.tsx")
          text = p.read_text()
          start = text.find('function stackAutomaticPreview(page: HTMLElement) {')
          end = text.find('\n\nfunction openLabelSaveChoice', start)
          if start < 0 or end < 0:
              raise SystemExit("app/label-workspace-refinement.tsx: automatic preview patch block missing")
          text = text[:start] + text[end+2:]
          call = '  stackAutomaticPreview(page);\n'
          if text.count(call) != 1:
              raise SystemExit("app/label-workspace-refinement.tsx: automatic preview call missing")
          text = text.replace(call, '', 1)
          p.write_text(text)

          # Regression contracts now assert the real runtime paths rather than stale DOM markers.
          p = Path("tests/seiko-operational-ux-contract.test.mjs")
          text = p.read_text()
          old = '  assert.match(ux, /orderRowClickable/);\n  assert.match(ux, /open\\.hidden = true/);\n  assert.match(ux, /orderMenuStatusControl/);'
          new = '  assert.match(ux, /orderRowClickable/);\n  assert.match(ux, /open\\.hidden = true/);\n  assert.match(ux, /statusWrap\\?\\.removeAttribute\\("hidden"\\)/);\n  assert.doesNotMatch(ux, /orderCenterStatusBadge/);\n  assert.match(ux, /orderMenuStatusControl/);'
          if text.count(old) != 1:
              raise SystemExit("tests/seiko-operational-ux-contract.test.mjs: order-center assertion marker missing")
          text = text.replace(old, new, 1)
          old = 'test("automatic label fields flow vertically instead of collapsing into one corner", () => {\n  assert.match(labels, /stackAutomaticPreview/);\n  assert.match(labels, /start \\+ index \\* step/);\n  assert.match(labels, /2 \\+ index \\* step/);\n  assert.match(css, /fieldChoice\\.chosen/);\n});'
          new = 'test("automatic label fields use the source-owned physical arrangement", () => {\n  assert.doesNotMatch(labels, /stackAutomaticPreview/);\n  assert.match(labelDesigner, /arrangeLabelItemsForRow/);\n  assert.match(labelDesigner, /advanced \\? items : arrangeLabelItemsForRow/);\n  assert.match(css, /fieldChoice\\.chosen/);\n});'
          if text.count(old) != 1:
              raise SystemExit("tests/seiko-operational-ux-contract.test.mjs: automatic layout assertion marker missing")
          p.write_text(text.replace(old, new, 1))

          p = Path("tests/navigation-contract.test.mjs")
          text = p.read_text()
          marker = '  assert.match(rootPage, /className="moduleMenu"/);\n'
          addition = marker + '  assert.doesNotMatch(rootPage, /setBusinessId\\(next\\.some[\\s\\S]{0,180}setModule\\("home"\\)/);\n'
          if text.count(marker) != 1:
              raise SystemExit("tests/navigation-contract.test.mjs: navigation assertion marker missing")
          p.write_text(text.replace(marker, addition, 1))

          p = Path("tests/seiko-stage2-audit-contract.test.mjs")
          text = p.read_text()
          marker = '  assert.match(orders, /aria-label="More order actions"/);\n'
          addition = marker + '  assert.match(orders, /workspaceBackButton/);\n  assert.doesNotMatch(orders, /setLabelMenuOpen/);\n'
          if text.count(marker) != 1:
              raise SystemExit("tests/seiko-stage2-audit-contract.test.mjs: workspace assertion marker missing")
          p.write_text(text.replace(marker, addition, 1))
          PY

          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm .github/workflows/fix-seiko-runtime-regressions.yml
          git add app tests
          git commit -m "Fix SEIKO runtime navigation and label regressions"
          git push origin HEAD:fix/veyn-milestone-one
