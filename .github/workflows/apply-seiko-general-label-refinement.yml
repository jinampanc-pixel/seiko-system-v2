name: Apply general SEIKO label refinement

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/apply-seiko-general-label-refinement.yml
      - .github/scripts/apply-seiko-general-label-refinement.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Apply shared label and workspace behavior
        run: python .github/scripts/apply-seiko-general-label-refinement.py
      - name: Add final shared workspace and label styles
        run: |
          cat >> app/seiko-workspace-label-final.css <<'CSS'

          /* ---------------- General label workspace refinement ---------------- */
          .workspaceHeadActions>div:has(.orderActionMenuButton){position:relative!important}
          .workspacePage .orderActionMenu{right:0!important;z-index:120!important}
          .labelDesignerPage .labelSaveBar{display:flex!important;justify-content:flex-end!important;align-items:center!important;gap:7px!important;position:relative!important}
          .labelDesignerPage .labelWorkspaceMore{position:relative!important}
          .labelDesignerPage .labelWorkspaceMoreButton{min-width:38px!important;padding:0 9px!important}
          .labelDesignerPage .labelWorkspaceMoreMenu{position:absolute;z-index:150;top:calc(100% + 5px);right:0;display:grid;min-width:190px;padding:6px;border:1px solid var(--line);border-radius:9px;background:var(--paper);box-shadow:0 16px 38px rgba(14,42,61,.18)}
          .labelDesignerPage .labelWorkspaceMoreMenu button{min-height:34px;border:0;border-radius:6px;background:transparent;text-align:left;padding:0 9px;color:var(--ink);font-size:10px;font-weight:750}
          .labelDesignerPage .labelWorkspaceMoreMenu button:hover{background:var(--pale)}
          .labelDesignerPage .labelSetup{align-items:start!important}
          .labelDesignerPage .labelSetup>label,
          .labelDesignerPage .labelSetup>.managedSizeControl{display:grid!important;grid-template-rows:auto 44px!important;align-content:start!important;gap:5px!important}
          .labelDesignerPage .managedSizeControl>.labelSetupHelp{display:none!important}
          .labelDesignerPage .labelInfoSelectedStripReact{display:flex!important;flex-wrap:wrap!important;gap:6px!important;margin:8px 0!important}
          .labelDesignerPage .labelInfoSelectedStripReact .labelInfoChip{display:inline-flex!important;align-items:center!important;gap:7px!important;min-height:30px!important;border:0!important;border-radius:18px!important;padding:4px 9px 4px 10px!important;background:var(--navy)!important;color:#fff!important;font-size:9px!important;font-weight:800!important}
          .labelDesignerPage .labelInfoSelectedStripReact .labelInfoChip b{font-size:15px!important;line-height:1!important;font-weight:500!important}
          .labelDesignerPage .fieldOrderControls{display:flex;gap:3px;justify-content:flex-end;margin-left:auto}
          .labelDesignerPage .fieldOrderControls button{width:27px;height:27px;min-height:27px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--navy);font-weight:900}
          .labelDesignerPage .labelGeometryFields{display:grid;grid-template-columns:1fr 1fr;gap:6px;grid-column:1/-1}
          .labelDesignerPage .labelGeometryFields label{display:grid;gap:3px}
          .labelDesignerPage .labelGeometryFields span{font-size:8px;font-weight:800;color:var(--muted)}
          .labelDesignerPage .labelGeometryFields input{width:100%;height:34px}
          .labelDesignerPage .recordList .record{position:relative;overflow:visible!important}
          .labelDesignerPage .recordList .record:hover::after,
          .labelDesignerPage .recordList .record:focus-visible::after{content:attr(data-record-preview);position:absolute;z-index:220;right:calc(100% + 8px);top:0;width:min(380px,46vw);padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);box-shadow:0 16px 38px rgba(14,42,61,.17);color:var(--ink);font:650 10px/1.45 var(--ui-font);text-align:left;white-space:normal;pointer-events:none}
          .labelCopiesField{display:grid!important;gap:6px!important;margin-top:14px!important}
          .labelCopiesField span{font-size:10px!important;font-weight:800!important;color:var(--muted)!important}
          .labelCopiesField input{height:40px!important;border:1px solid var(--line)!important;border-radius:8px!important;padding:0 10px!important;background:var(--paper)!important;color:var(--ink)!important}
          .labelPrintCopies{display:none!important}
          @media(max-width:820px){
            .labelDesignerPage .recordList .record:hover::after,.labelDesignerPage .recordList .record:focus-visible::after{display:none}
            .labelDesignerPage .labelGeometryFields{grid-template-columns:1fr 1fr}
          }
          CSS
      - name: Clean one-shot updater and commit
        run: |
          git rm -f .github/scripts/apply-seiko-general-label-refinement.py .github/workflows/apply-seiko-general-label-refinement.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app .github
          git commit -m "Refine SEIKO Home workspace and shared label editor"
          git push origin HEAD:fix/veyn-milestone-one
