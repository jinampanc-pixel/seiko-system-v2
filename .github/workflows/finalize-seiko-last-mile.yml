name: Finalize SEIKO last-mile

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/finalize-seiko-last-mile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Apply final workspace and label cleanup
        run: python3 scripts/finalize-seiko-last-mile.py
      - name: Commit cleaned source
        run: |
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm -f scripts/finalize-seiko-last-mile.py .github/workflows/finalize-seiko-last-mile.yml
          git add app tests SEIKO_STAGE2_ACCEPTANCE.md
          git commit -m "Finalize SEIKO workspace and label information UX"
          git push origin HEAD:fix/veyn-milestone-one
