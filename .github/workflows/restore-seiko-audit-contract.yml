name: Restore full SEIKO audit contract coverage

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/restore-seiko-audit-contract.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Restore original audit and change only stale toolbar assertion
        shell: bash
        run: |
          git show c77e9c973c735779cfacd922b46cc91742663700:tests/seiko-stage2-audit-contract.test.mjs > /tmp/seiko-stage2-audit-contract.test.mjs
          python3 <<'PY'
          from pathlib import Path
          p = Path('/tmp/seiko-stage2-audit-contract.test.mjs')
          text = p.read_text()
          old = '  assert.match(orders, /workspaceSheetBar/);\n'
          new = '  assert.doesNotMatch(orders, /className="workspaceSheetBar"/);\n  assert.match(orders, /workspaceCompactTools/);\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale workspaceSheetBar assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          cp /tmp/seiko-stage2-audit-contract.test.mjs tests/seiko-stage2-audit-contract.test.mjs
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm .github/workflows/restore-seiko-audit-contract.yml
          git add tests/seiko-stage2-audit-contract.test.mjs
          git commit -m "Restore full SEIKO audit contract coverage"
          git push origin HEAD:fix/veyn-milestone-one
