name: Apply SEIKO PDF acceptance

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/apply-seiko-pdf-acceptance.yml
      - .github/scripts/apply-seiko-pdf-acceptance.cjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Apply acceptance source changes
        run: |
          # The audit file already had this reader; the one-shot updater places the
          # consolidated acceptance readers together after finalUx.
          sed -i '/^const orderDomain = read("app\/lib\/order-domain.ts");$/d' tests/seiko-stage2-audit-contract.test.mjs
          node .github/scripts/apply-seiko-pdf-acceptance.cjs
      - name: Lock final acceptance layout
        run: |
          cat >> app/seiko-workspace-label-final.css <<'CSS'

          /* ---------------- PDF acceptance: Order Center / Setup ---------------- */
          .ordersPage .phase2OrderActions{display:none!important}
          .ordersPage .orderArchiveButton{
            min-height:36px!important;
            border:1px solid var(--line)!important;
            border-radius:8px!important;
            padding:7px 11px!important;
            background:var(--paper)!important;
            color:var(--muted)!important;
            font-size:10px!important;
            font-weight:800!important;
            white-space:nowrap!important;
          }
          .ordersPage .orderArchiveButton:hover{border-color:color-mix(in srgb,var(--red) 30%,var(--line))!important;color:var(--red)!important}
          .orderSetup .clientDetails .setupGrid{grid-template-columns:repeat(6,minmax(0,1fr))!important}
          .orderSetup .clientDetails .setupGrid>*{grid-column:span 2!important}
          .orderSetup .clientDetails .seikoDeliveryAddress,
          .orderSetup .clientDetails .seikoBillingAddress{grid-column:span 3!important}
          .orderSetup .ownerManagedSelect{display:none!important}
          .orderSetup .sourceOwnerCombo{display:none!important}
          .orderSetup .sourceFieldPicker>label>.sourceNativeHidden{
            position:static!important;
            width:100%!important;
            height:38px!important;
            opacity:1!important;
            pointer-events:auto!important;
          }

          /* ---------------- PDF acceptance: Label workspace ---------------- */
          .labelDesignerPage .customerUpdateChoice{display:none!important}
          .labelDesignerPage .labelSaveBar .labelSetSave{
            min-height:34px!important;
            border:1px solid var(--navy)!important;
            border-radius:8px!important;
            padding:0 12px!important;
            background:var(--navy)!important;
            color:#fff!important;
            font-weight:800!important;
          }
          .labelDesignerPage .labelSelectionPreviewGrid{
            grid-template-columns:minmax(0,1.75fr) minmax(300px,.55fr)!important;
            grid-template-rows:minmax(560px,1fr)!important;
          }
          .labelDesignerPage .labelSelectionPreviewGrid>.labelCanvasPanel{
            grid-column:1!important;
            grid-row:1!important;
            order:1!important;
          }
          .labelDesignerPage .labelSelectionPreviewGrid>.labelSidebar{
            grid-column:2!important;
            grid-row:1!important;
            order:2!important;
            max-height:560px!important;
            overflow:auto!important;
          }
          .labelDesignerPage .labelPreviewSample{
            display:flex!important;
            align-items:center!important;
            gap:6px!important;
            margin-left:auto!important;
            color:var(--muted)!important;
            font-size:9px!important;
            font-weight:800!important;
            white-space:nowrap!important;
          }
          .labelDesignerPage .labelPreviewSample select{
            max-width:260px!important;
            height:34px!important;
            border:1px solid var(--line)!important;
            border-radius:7px!important;
            background:var(--paper)!important;
            padding:0 28px 0 8px!important;
            color:var(--ink)!important;
            font-size:10px!important;
            font-weight:650!important;
          }
          .labelDesignerPage .labelSetup>label:has(.labelTypeHelp){grid-template-rows:auto 44px auto!important}
          .labelDesignerPage .labelTypeHelp{
            margin-top:1px!important;
            color:var(--muted)!important;
            font-size:9px!important;
            line-height:1.25!important;
          }

          @media(max-width:1250px) and (min-width:721px){
            .orderSetup .clientDetails .setupGrid{grid-template-columns:repeat(4,minmax(0,1fr))!important}
            .orderSetup .clientDetails .setupGrid>*{grid-column:span 2!important}
            .orderSetup .clientDetails .seikoDeliveryAddress,
            .orderSetup .clientDetails .seikoBillingAddress{grid-column:span 2!important}
          }
          @media(max-width:820px){
            .labelDesignerPage .labelSelectionPreviewGrid{grid-template-columns:1fr!important;grid-template-rows:auto auto!important}
            .labelDesignerPage .labelSelectionPreviewGrid>.labelCanvasPanel,
            .labelDesignerPage .labelSelectionPreviewGrid>.labelSidebar{grid-column:1!important;grid-row:auto!important;max-height:none!important}
            .labelDesignerPage .labelPreviewSample{width:100%!important;margin:6px 0 0!important;justify-content:space-between!important}
            .labelDesignerPage .labelPreviewSample select{max-width:min(70vw,320px)!important}
          }
          @media(max-width:720px){
            .orderSetup .clientDetails .setupGrid{grid-template-columns:1fr!important}
            .orderSetup .clientDetails .setupGrid>*,
            .orderSetup .clientDetails .seikoDeliveryAddress,
            .orderSetup .clientDetails .seikoBillingAddress{grid-column:1!important}
            .ordersPage .orderArchiveButton{grid-area:menu!important;justify-self:end!important}
          }
          CSS
      - name: Clean one-shot updater and commit
        run: |
          git rm .github/scripts/apply-seiko-pdf-acceptance.cjs .github/workflows/apply-seiko-pdf-acceptance.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app tests .github
          git commit -m "Apply SEIKO PDF acceptance requirements"
          git push origin HEAD:fix/veyn-milestone-one
