name: SEIKO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Contract tests
        run: npm run test:contracts

      - name: Production build
        run: npm run build

      - name: Render checks
        run: npm run test:render

      - name: Install smoke browser
        run: npx playwright install --with-deps chromium

      - name: Navigation and payment smoke
        run: npm run test:smoke

      - name: Large order browser regression
        run: node tests/stabilization-smoke.cjs --large-orders

  backup-information:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Publish only the public backup information pages
        run: npx wrangler deploy --config wrangler.backup-info.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
