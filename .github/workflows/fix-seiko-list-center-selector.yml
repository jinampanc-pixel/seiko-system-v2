name: Fix SEIKO list center selector

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/fix-seiko-list-center-selector.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Correct Label Center selector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/seiko-list-center-enhancements.tsx')
          text = path.read_text()
          old = 'document.querySelectorAll<HTMLElement>(".labelLauncherPage").forEach(page => ensureLabelCenterMenus(page));'
          new = 'document.querySelectorAll<HTMLElement>(".labelLauncher").forEach(page => ensureLabelCenterMenus(page));'
          if old not in text:
              raise SystemExit('Label Center selector target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-seiko-list-center-selector.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app .github
          git commit -m "Wire SEIKO Label Center action menus"
          git push origin HEAD:fix/veyn-milestone-one
