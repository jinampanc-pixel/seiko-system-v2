name: Update SEIKO operational contracts

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/scripts/update-seiko-operational-contracts.py
      - .github/workflows/update-seiko-operational-contracts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Update acceptance contracts
        run: python .github/scripts/update-seiko-operational-contracts.py
      - name: Remove updater and commit tests
        run: |
          git rm -f .github/scripts/update-seiko-operational-contracts.py .github/workflows/update-seiko-operational-contracts.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add tests .github
          git commit -m "Lock SEIKO operational interaction contracts"
          git push origin HEAD:fix/veyn-milestone-one
