name: Fix final SEIKO lint blocker

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/fix-seiko-final-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Remove unused test fixture and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/seiko-stage2-audit-contract.test.mjs')
          text = path.read_text()
          old = 'const homeCss = read("app/seiko-phase1.css");\n'
          if old not in text:
              raise SystemExit('homeCss fixture line not found')
          path.write_text(text.replace(old, '', 1))
          PY
          git rm .github/workflows/fix-seiko-final-lint.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add tests .github
          git commit -m "Fix final SEIKO lint blocker"
          git push origin HEAD:fix/veyn-milestone-one
