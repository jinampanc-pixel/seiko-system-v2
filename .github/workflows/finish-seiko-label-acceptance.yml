name: Finish SEIKO label acceptance

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/finish-seiko-label-acceptance.yml
      - .github/scripts/finish-seiko-label-acceptance.cjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Apply final label acceptance behavior
        run: node .github/scripts/finish-seiko-label-acceptance.cjs
      - name: Add final filter UI styles
        run: |
          cat >> app/seiko-workspace-label-final.css <<'CSS'

          /* ---------------- PDF acceptance: record filter/sort controls ---------------- */
          .labelDesignerPage .recordFilterBar{
            display:grid!important;
            grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(125px,.72fr)!important;
            gap:6px!important;
            margin:7px 0 9px!important;
          }
          .labelDesignerPage .recordFilterBar label{
            display:grid!important;
            gap:3px!important;
            min-width:0!important;
          }
          .labelDesignerPage .recordFilterBar label>span{
            color:var(--muted)!important;
            font-size:8px!important;
            font-weight:850!important;
            letter-spacing:.02em!important;
          }
          .labelDesignerPage .recordFilterBar select{
            box-sizing:border-box!important;
            width:100%!important;
            min-width:0!important;
            height:32px!important;
            border:1px solid var(--line)!important;
            border-radius:7px!important;
            background:var(--paper)!important;
            padding:0 26px 0 7px!important;
            color:var(--ink)!important;
            font-size:9px!important;
            font-weight:650!important;
          }
          .labelDesignerPage .recordFilterBar select:disabled{opacity:.48!important}
          .labelDesignerPage .traceTotalChoice{
            display:flex!important;
            align-items:center!important;
            gap:5px!important;
            grid-column:1/-1!important;
            margin:1px 0!important;
            color:var(--muted)!important;
            font-size:9px!important;
            font-weight:700!important;
          }
          @media(max-width:650px){
            .labelDesignerPage .recordFilterBar{grid-template-columns:1fr!important}
          }
          CSS
      - name: Clean updater and commit
        run: |
          git rm .github/scripts/finish-seiko-label-acceptance.cjs .github/workflows/finish-seiko-label-acceptance.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app tests .github
          git commit -m "Finish SEIKO label filtering and trace numbering"
          git push origin HEAD:fix/veyn-milestone-one
