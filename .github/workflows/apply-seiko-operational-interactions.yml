name: Apply SEIKO operational interactions

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/scripts/apply-seiko-operational-interactions.py
      - .github/workflows/apply-seiko-operational-interactions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Correct updater source targets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-seiko-operational-interactions.py')
          text = path.read_text()
          text = text.replace('appendMetaItem(meta, "Delivery", deliveryState(order));', 'appendMetaItem(meta, "Delivery", dueLabel(order));')
          text = text.replace("t=rep(t,'meta.appendChild(item);\\n}', 'meta.appendChild(item);\\n  return item;\\n}', 'append meta return')", "t=rep(t,'host.appendChild(item);\\n}', 'host.appendChild(item);\\n  return item;\\n}', 'append meta return')")
          path.write_text(text)
          PY
      - name: Apply operational interaction pass
        run: python .github/scripts/apply-seiko-operational-interactions.py
      - name: Remove updater and commit source
        run: |
          git rm -f .github/scripts/apply-seiko-operational-interactions.py .github/workflows/apply-seiko-operational-interactions.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app .github
          git commit -m "Refine SEIKO operational interactions"
          git push origin HEAD:fix/veyn-milestone-one
