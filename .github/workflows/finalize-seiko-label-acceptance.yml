name: Finalize SEIKO label acceptance

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/finalize-seiko-label-acceptance.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Apply exact label refinements
        run: python .github/scripts/finalize-seiko-label-acceptance.py
      - name: Validate full SEIKO application
        run: npm test
      - name: Commit validated refinements and remove all one-shot files
        run: |
          git rm -f .github/scripts/finalize-seiko-label-acceptance.py .github/workflows/finalize-seiko-label-acceptance.yml .github/workflows/fix-label-direct-edit-and-applicability.yml .github/scripts/fix-seiko-sept1-runtime.py .github/workflows/run-seiko-sept1-runtime.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app tests SEIKO_STAGE2_ACCEPTANCE.md
          git commit -m "Finalize direct label editing and applicability"
          git push origin HEAD:fix/veyn-milestone-one
