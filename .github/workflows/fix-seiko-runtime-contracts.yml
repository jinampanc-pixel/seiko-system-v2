name: Align SEIKO runtime contracts

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/fix-seiko-runtime-contracts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Update runtime contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('tests/seiko-operational-ux-contract.test.mjs')
          text = p.read_text()
          old = '  assert.doesNotMatch(ux, /orderCenterStatusBadge/);'
          new = '  assert.doesNotMatch(ux, /className = "orderCenterStatusBadge"/);'
          if text.count(old) != 1:
              raise SystemExit('operational status badge assertion marker missing')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/seiko-stage2-audit-contract.test.mjs')
          text = p.read_text()
          old = 'test("Order Center keeps status in operational metadata, rich workflow filters and archived state inside filters", () => {\n  assert.match(operationalUx, /appendMetaItem\\(meta, "Status", order\\.status\\)/);'
          new = 'test("Order Center keeps interactive status, rich workflow filters and archived state inside filters", () => {\n  assert.match(operationalUx, /statusWrap\\?\\.removeAttribute\\("hidden"\\)/);\n  assert.match(operationalUx, /orderCenterInlineStatus/);\n  assert.doesNotMatch(operationalUx, /appendMetaItem\\(meta, "Status", order\\.status\\)/);'
          if text.count(old) != 1:
              raise SystemExit('stage2 order-center status assertion marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm .github/workflows/fix-seiko-runtime-contracts.yml
          git add tests
          git commit -m "Align contracts with interactive Order Center status"
          git push origin HEAD:fix/veyn-milestone-one
