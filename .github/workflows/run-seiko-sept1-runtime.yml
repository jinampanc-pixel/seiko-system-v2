name: Run SEIKO runtime accuracy fix

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/run-seiko-sept1-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Apply runtime accuracy source fixes
        run: python3 .github/scripts/fix-seiko-sept1-runtime.py
      - name: Commit source and clean temporary patch files
        shell: bash
        run: |
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git rm -f .github/scripts/fix-seiko-sept1-runtime.py .github/workflows/run-seiko-sept1-runtime.yml
          git add app
          git commit -m "Fix SEIKO runtime UX accuracy"
          git push origin HEAD:fix/veyn-milestone-one
