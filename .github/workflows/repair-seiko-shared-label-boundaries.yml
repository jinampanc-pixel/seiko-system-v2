name: Repair shared SEIKO label boundaries

on:
  push:
    branches:
      - fix/veyn-milestone-one
    paths:
      - .github/workflows/repair-seiko-shared-label-boundaries.yml
      - .github/scripts/repair-seiko-shared-label-boundaries.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veyn-milestone-one
          fetch-depth: 0
      - name: Repair function boundaries
        run: python .github/scripts/repair-seiko-shared-label-boundaries.py
      - name: Commit repaired source and remove one-shot files
        run: |
          git rm -f .github/scripts/repair-seiko-shared-label-boundaries.py .github/workflows/repair-seiko-shared-label-boundaries.yml
          git config user.name "jinampanc-pixel"
          git config user.email "jinampanc@gmail.com"
          git add app/label-designer.tsx app/label-finalization.tsx
          git commit -m "Repair shared SEIKO label editor boundaries"
          git push origin HEAD:fix/veyn-milestone-one
